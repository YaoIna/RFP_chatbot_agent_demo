[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rfq-agent"
version = "0.1.0"
description = "A local English-language IT RFQ CLI demo"
requires-python = ">=3.12,<3.13"
dependencies = [
  "typer>=0.12,<1", "rich>=13,<15", "pydantic>=2,<3",
  "pydantic-settings>=2,<3", "langchain-core>=0.3,<2",
  "langchain-openai>=0.3,<2", "langgraph>=0.3,<2",
  "langgraph-checkpoint-sqlite>=2,<4", "python-docx>=1,<2",
]

[project.scripts]
rfq-agent = "rfq_agent.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1", "mypy>=1,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["deepseek: opt-in live DeepSeek acceptance"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
